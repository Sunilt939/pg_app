name: app
description: "A mobile app for PG owners and their guests."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  supabase_flutter: ^2.5.0
  flutter_svg: ^2.0.10
  phosphor_flutter: ^2.1.0
  image_picker: ^1.1.0
  url_launcher: ^6.2.6
  share_plus: ^9.0.0
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
    - assets/images/auth/
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/brand/app_icon_1024.png"
  adaptive_icon_background: "#1A4D6B"
  adaptive_icon_foreground: "assets/brand/app_icon_foreground_1024.png"

flutter_native_splash:
  color: "#1A4D6B"
  image: assets/brand/splash_mark.png
  android_12:
    color: "#1A4D6B"
    image: assets/brand/splash_mark.png

